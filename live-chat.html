<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Chat | Doraemon World</title><link rel="stylesheet" href="css/community.css">
<script src="js/live-chat.js" defer></script><link rel="stylesheet" href="./css/site-navigation.css">
<script defer src="./js/site-config.js"></script>
<script defer src="./js/site-navigation.js"></script>
</head>
<body><main class="community"><h1>Live chat</h1>
<p>Ek public room mein Doraemon fans ke saath baat karo.</p>
<p id="connection" role="status">Connecting…</p>
<ol id="messages" aria-label="Recent messages" aria-live="polite"></ol>
<form id="composer"><label>Nickname<input id="nickname" maxlength="24" required autocomplete="nickname"></label>
<label>Message<input id="message" maxlength="350" required autocomplete="off"></label>
<button id="send" disabled>Send</button></form><p id="feedback" role="status"></p></main></body></html>
