<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Talk to Doraemon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            color: #07538b;
            background: radial-gradient(circle, #ffffff, #d9f3ff);
        }

        .back {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 11px 17px;
            border-radius: 14px;
            background: white;
            color: #07538b;
            text-decoration: none;
            box-shadow: 0 4px 18px #087dcc20;
        }

        main {
            width: min(480px, 94vw);
            padding: 80px 20px 35px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }

        .note {
            font-size: 12px;
            color: #638097;
        }

        #character {
            width: min(300px, 70vw);
            height: min(300px, 70vw);
            margin: 35px auto;
            padding: 20px;
            display: grid;
            place-items: center;
            border: 4px solid #5cbcff;
            border-radius: 50%;
            background: #ffffffc9;
            box-shadow: 0 0 45px #079bea30;
            cursor: pointer;
            transition: border-color .25s, box-shadow .25s;
        }

        #character img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        body[data-state="listening"] #character {
            border-color: #ffcc29;
            box-shadow: 0 0 55px #ffcc2960;
        }

        body[data-state="speaking"] #character {
            border-color: #23bf80;
            box-shadow: 0 0 55px #23bf8055;
            animation: talking .5s ease-in-out infinite alternate;
        }

        body[data-state="thinking"] #character {
            border-color: #9d7bea;
        }

        @keyframes talking {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-5px) scale(1.025); }
        }

        #status {
            min-height: 54px;
            font-size: 16px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #character:focus-visible {
            outline: 3px solid #07538b;
            outline-offset: 6px;
        }

        @media (prefers-reduced-motion: reduce) {
            #character {
                animation: none !important;
            }
        }
    </style>
<link rel="stylesheet" href="css/community.css">
<script src="js/buddy-model.js"></script><script src="js/buddy.js"></script>
<link rel="stylesheet" href="./css/site-navigation.css">
<script defer src="./js/site-config.js"></script>
<script defer src="./js/site-navigation.js"></script>
</head>

<body class="dw-voice" data-state="idle">
    <a class="back" href="index.html">← Home</a>

    <main>
        <h1>Doraemon Buddy 💙</h1>
        <p class="note">Unofficial fan AI • Generated voice</p>

        <button id="character"
                type="button"
                aria-label="Doraemon: tap to enable sound or retry">
            <img src="assets/images/characters/doraemon.png"
                 alt="Doraemon">
        </button>

        <p id="status" role="status">Connect ho raha hai...</p>
        <p class="note">
            Yellow: sun raha hai • Green: bol raha hai
        </p>
</main>

    <script>
    (() => {
        "use strict";

        const GEMINI_URL =
            "https://doraemon-ai.hackerblackpanther2000.workers.dev";



        const Recognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        const character = document.getElementById("character");
        const status = document.getElementById("status");



        let recognizer = null;
        let running = false;
        let leaving = false;
        let history = [];
        let greeted = false;


        function state(name, message) {
            document.body.dataset.state = name;
            status.textContent = message;
        }

        async function requestJSON(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                signal: AbortSignal.timeout(90000)
            });

            let data;

            try {
                data = await response.json();
            } catch {
                throw new Error(
                    "Server ka response nahi mila. Colab link check karo."
                );
            }

            if (!response.ok) {
                throw new Error(data.error || "Server request fail hui.");
            }

            return data;
        }

        // Gradio queue result arrives as server-sent events.
        async function speak(text) {
            if ("speechSynthesis" in window) {
                state("speaking", text);
                await new Promise((resolve,reject) => {
                    const line = new SpeechSynthesisUtterance(text);
                    line.lang = /[ऀ-ॿ]/.test(text) ? "hi-IN" : "en-IN";
                    line.onend = resolve;
                    line.onerror = () => reject(new Error("Voice unavailable. Please try a speech-enabled browser."));
                    speechSynthesis.speak(line);
                });
                return;
            }
            state("idle", text);

        }

        function listen() {
            if (leaving) return;

            if (!Recognition) {
                running = false;
                state(
                    "idle",
                    "Is browser mein voice recognition available nahi."
                );
                return;
            }

            const current = new Recognition();
            recognizer = current;

            current.lang = "hi-IN";
            current.continuous = false;
            current.interimResults = false;

            let heard = "";
            let failed = false;

            current.onresult = event => {
                heard = event.results[0][0].transcript.trim();
            };

            current.onerror = event => {
                if (event.error === "no-speech") return;

                failed = true;
                running = false;

                state(
                    "idle",
                    event.error === "not-allowed"
                        ? "Microphone permission Allow karo, phir Doraemon par tap karo."
                        : "Mic problem. Doraemon par tap karke retry karo."
                );
            };

            current.onend = () => {
                if (recognizer === current) recognizer = null;
                if (leaving || failed) return;

                if (heard) {
                    answer(heard);
                } else {
                    running = false;
                    state(
                        "idle",
                        "Awaaz nahi mili. Dobara baat karne ke liye Doraemon par tap karo."
                    );
                }
            };

            try {
                state("listening", "💛 Sun raha hoon... bolo!");
                current.start();
            } catch {
                running = false;
                state("idle", "Mic start nahi hua. Doraemon par tap karo.");
            }
        }

        async function answer(message) {
            try {
                state("thinking", "💭 Soch raha hoon...");

                const localReply = window.dwBuddyReply(message);
                const data = localReply ? {reply: localReply} : await requestJSON(GEMINI_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: message.slice(0, 1500),
                        history: history.slice(-10)
                    })
                });

                if (typeof data.reply !== "string" || !data.reply.trim()) {
                    throw new Error("Gemini ka jawab nahi mila.");
                }

                history.push(
                    { role: "user", text: message.slice(0, 1500) },
                    { role: "model", text: data.reply.slice(0, 3000) }
                );

                history = history.slice(-10);

                
                await speak(data.reply);
                listen();

            } catch (error) {
                running = false;
                if (!leaving) {
                    state("idle", error.message + " Doraemon par tap karke retry karo.");
                }
            }
        }

        async function start() {
            if (leaving || running) return;
            running = true;

            try {
                if (!greeted) {
                    await speak(
                        "हेलो! मेरा नाम डोरेमोन है। आपका नाम क्या है?"
                    );
                    greeted = true;
                }

                listen();

            } catch (error) {
                running = false;
                if (!leaving) {
                    state("idle", error.message + " Doraemon par tap karo.");
                }
            }
        }

        character.addEventListener("click", start);

        window.addEventListener("pagehide", () => {
            leaving = true;
            window.speechSynthesis?.cancel();

            recognizer?.abort();
        });

        state("idle", "Baat karne ke liye Doraemon par tap karo.");
    })();
    </script>
</body>
</html>
